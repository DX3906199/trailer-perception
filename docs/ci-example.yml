name: CPU geometry and interface tests (optional CI template)
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_pose.py tests/test_cli.py
      - run: trailer-perception geometry-demo --output outputs/geometry_demo.json
